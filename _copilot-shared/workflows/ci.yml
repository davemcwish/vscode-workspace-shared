# ============================================================================
#  REFERENCE TEMPLATE ONLY - this file is NOT auto-synced into projects.
#
#  ci.yml is PROJECT-OWNED (scaffold-once), like pyproject.toml. The sync
#  script (powershell\sync-shared-copilot.ps1) deliberately EXCLUDES ci.yml
#  from the workflows copy via $FolderExcludeFiles, because each project has a
#  different CI shape and one file cannot serve them all:
#    - Salesforce      : installable src\ package + requirements*.txt (+ JFrog)
#    - eu-spm          : scripts-only, requirements*.in, hardened (SHA-pinned)
#    - trails-and-tails: docs/website, no importable Python source
#
#  To change a project's CI, edit THAT project's own .github\workflows\ci.yml.
#  This file is a generic starting point kept for reference only. See
#  _copilot-shared\TASK-ci-yml-reconciliation.md for the planned hardening and
#  reconciliation of every project's CI (SHA-pinned Actions, least-privilege
#  token, correct per-project layout).
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev.txt and requirements.txt both contain an --index-url
        # pointing to Ford's internal JFrog Artifactory, which is not reachable
        # from GitHub Actions runners. We strip that directive before passing
        # each file to pip so PyPI is used instead. The committed files are
        # unchanged — local development still uses JFrog.
        run: |
          python -m pip install --upgrade pip
          grep -v "index-url" requirements-dev.txt | pip install -r /dev/stdin
          grep -v "index-url" requirements.txt | pip install -r /dev/stdin
          pip install -e .

      - name: Markdown lint
        # markdownlint-cli2 is pinned to @0.22.1 so CI matches the local gate
        # (sanity.bat / sanity_v.bat step 7). An unpinned "npx markdownlint-cli2"
        # resolves to the latest release, which can enable new rules and make CI
        # and local disagree. Keep this version in sync with this repo's
        # sanity.bat and sanity_v.bat (step 7).
        run: npx markdownlint-cli2@0.22.1 "docs/**/*.md" "*.md"

      - name: ruff format check
        run: ruff format --check src tests scripts

      - name: ruff lint
        run: ruff check src tests scripts

      - name: mypy type check
        run: mypy

      - name: bandit security scan
        run: bandit -c pyproject.toml -r src scripts --exclude scripts/archive,tests --quiet

      - name: detect-secrets scan
        run: python -m detect_secrets scan --baseline .secrets.baseline

      - name: pytest
        # Coverage flags (--cov, --cov-report, --cov-fail-under, --strict-markers)
        # are defined once in pyproject.toml [tool.pytest.ini_options] addopts and
        # inherited automatically. Only -n auto is added here for CI parallelism.
        # Never duplicate addopts flags in this file — change the threshold in
        # pyproject.toml only.
        run: pytest -n auto
