name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev.txt contains --index-url pointing to Ford's internal
        # JFrog Artifactory, which is not reachable from GitHub Actions runners.
        # We strip that directive before passing the file to pip so PyPI is used.
        # The committed file is unchanged — local development still uses JFrog.
        run: |
          python -m pip install --upgrade pip
          grep -v "index-url" requirements-dev.txt | pip install -r /dev/stdin
          pip install -r requirements.txt
          pip install -e .

      - name: ruff format check
        run: ruff format --check src tests scripts

      - name: ruff lint
        run: ruff check src tests scripts

      - name: mypy type check
        run: mypy

      - name: bandit security scan
        run: bandit -c pyproject.toml -r src scripts --exclude scripts/archive,tests --quiet

      - name: detect-secrets scan
        run: python -m detect_secrets scan --baseline .secrets.baseline

      - name: pytest
        run: pytest -n auto --cov=src --cov=scripts --cov-report=term-missing
